<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Uluyol Adliye Kafeterya | Menü</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{

background:#f6f4ef;

font-family:'Segoe UI',sans-serif;

}

.header{

background:#0B2341;

padding:25px;

color:white;

text-align:center;

border-radius:0 0 25px 25px;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}

.logo{

width:80px;

margin-bottom:10px;

}

.header h2{

font-weight:bold;

margin:0;

}

.header p{

color:#d8d8d8;

margin-top:5px;

}

.search{

margin:20px;

}

.form-control{

border-radius:15px;

padding:13px;

}

.category{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.10);

margin-bottom:20px;

transition:.3s;

cursor:pointer; 

}

.category:hover{

transform:translateY(-5px);

}

.category img{

width:100%;

height:180px;

object-fit:fill;

display:block;

}

.category-body{

padding:20px;

}

.category-title{

font-size:22px;

font-weight:bold;

color:#0B2341;

}

.category-count{

color:#888;

}

.arrow{

font-size:22px;

color:#D4AF37;

}

.footer{

height:40px;

}

</style>

</head>

<body>

<div class="header">

<img src="images/hlogo.png" class="logo">

<h2>ULUYOL ADLİYE KAFETERYA</h2>

<p>Dijital Menü</p>

</div>

<div class="search">

<input

type="text"

class="form-control"

placeholder="🔍 Menüde Ara...">

</div>

<div class="container">

<div class="category" onclick="location.href='hurunler.html?kategori=unlumamuller'">

<img src="images/kategoriler/unlumamuller.jpg">

<div class="category-body d-flex justify-content-between align-items-center">

<div>

<div class="category-title">

🥩 Unlu Mamüller

</div>

<div class="category-count">

3 Ürün

</div>

</div>

<div class="arrow">

<i class="bi bi-chevron-right"></i>

</div>

</div>

</div>





<div class="category" onclick="location.href='hurunler.html?kategori=tost'">

<img src="images/kategoriler/tost.jpg">

<div class="category-body d-flex justify-content-between align-items-center">

<div>

<div class="category-title">

🍕 Tost ve Köfteler

</div>

<div class="category-count">

5 Ürün

</div>

</div>

<div class="arrow">

<i class="bi bi-chevron-right"></i>

</div>

</div>

</div>



















<div class="category" onclick="location.href='hurunler.html?kategori=icecek'">

<img src="images/kategoriler/icecek.jpg">

<div class="category-body d-flex justify-content-between align-items-center">

<div>

<div class="category-title">

🥤 İçecekler

</div>

<div class="category-count">

14 Ürün

</div>

</div>

<div class="arrow">

<i class="bi bi-chevron-right"></i>

</div>

</div>
</div>









</div>

</div>

<div class="footer"></div>

</body>

</html>
